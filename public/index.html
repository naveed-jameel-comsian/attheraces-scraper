<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketplace Watcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-mesh" aria-hidden="true"></div>

    <div id="toast-root" class="toast-root">
      <div id="toast" class="toast" role="status" aria-live="polite" hidden>
        <span class="toast-icon" id="toast-icon" aria-hidden="true"></span>
        <div class="toast-text">
          <p class="toast-title" id="toast-title"></p>
          <p class="toast-message" id="toast-message"></p>
        </div>
      </div>
    </div>

    <div class="app">
      <header class="header">
        <div class="header-brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>Marketplace Watcher</h1>
            <p class="tagline">Live watches · saved listings · instant updates</p>
          </div>
        </div>
       
      </header>

      <section class="panel card-surface">
        <form id="add-form" class="add-form">
          <label class="sr-only" for="new-query">Search term to watch</label>
          <input
            id="new-query"
            type="text"
            placeholder="e.g. road bike, standing desk"
            autocomplete="off"
            required
          />
          <button type="submit" id="add-btn" class="btn-primary">
            <span class="btn-label">Add watch</span>
          </button>
        </form>
        <div class="status-row">
          <p id="status" class="status" aria-live="polite"></p>
          <span id="sse-meta" class="sse-pill" title="Server push connection"></span>
        </div>
      </section>

      <main id="view-grid" class="wrap view-enter">
        <div class="section-head">
          <h2 class="section-title">Your watches</h2>
          <span class="section-caption">Click a card to open listings</span>
        </div>
        <div id="query-grid" class="query-grid" aria-label="Saved searches"></div>
        <p id="grid-empty" class="empty-state hidden">
          <span class="empty-icon" aria-hidden="true">◇</span>
          No watches yet. Add a search term to get started.
        </p>
      </main>

      <main id="view-detail" class="wrap hidden">
        <div class="detail-toolbar card-surface">
          <button type="button" id="back-btn" class="btn-secondary">
            <span aria-hidden="true">←</span> All watches
          </button>
          <div class="detail-title-wrap">
            <h2 class="detail-title" id="detail-heading"></h2>
            <span class="pill" id="detail-count"></span>
          </div>
          <button type="button" id="refresh-btn" class="btn-secondary">Refresh now</button>
        </div>
        <p id="detail-error" class="detail-error hidden"></p>
        <section id="detail-results" class="grid" aria-label="Listings for this watch"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
